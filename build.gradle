import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.publish.PublishingExtension
import org.gradle.plugins.signing.Sign

/*
 * [Version Catalog]
 * 의존성 및 플러그인 버전은 'gradle/libs.versions.toml' 파일에서 통합 관리
 * 별도 설정 없이 Gradle이 기본 경로(gradle/libs.versions.toml)를 자동으로 인식하여 'libs' 접근자로 제공
 */
plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
}

group = project.property('group')
version = project.property('version')

repositories {
    mavenCentral()
    gradlePluginPortal()
}

java {
    /**
     * [Java Toolchain]
     * 빌드 실행 환경(JAVA_HOME)과 프로젝트 컴파일 환경을 분리하는 현대적인 방식
     */
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
    // Maven Central 필수 요건: 소스 및 자바독 JAR 생성
    withSourcesJar()
    withJavadocJar()
}

// GPG 서명 설정 (Maven Central 필수)
signing {
    sign publishing.publications
}

dependencies {
    implementation gradleApi()
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.3.0'
}

/*
 * [JAR 패키징 설정]
 * JAR 파일 루트에 README.md와 LICENSE 파일을 포함한다.
 */
jar {
    from('.') {
        include 'README.md'
        include 'LICENSE'
    }
}


/*
 * [Gradle 플러그인 배포 - Maven Central]
 *
 * Tasks → publishing → publishAllPublicationsToCentralPortalRepository 태스크 실행
 *
 * [사용 방법]
 *
 * 1. settings.gradle에 저장소 추가:
 *    pluginManagement {
 *        repositories {
 *            gradlePluginPortal()
 *            mavenCentral() // 중앙 저장소에서 플러그인을 찾도록 추가
 *        }
 *    }
 *
 * 2. build.gradle에 플러그인 적용:
 *    plugins {
 *        id 'io.github.devers2.buildsupport' version '0.1.0'
 *    }
 */
gradlePlugin {
    plugins {
        s2BuildSupportPlugin {
            id = 'io.github.devers2.buildsupport'
            implementationClass = 'io.github.devers2.buildsupport.S2BuildSupportPlugin'
            displayName = 'S2 Build Support'
            description = 'S2 project build utilities'
        }
    }
}
publishing {
    publications {
        // 모든 출판물에 공통적으로 POM 메타데이터를 적용 (Central Portal 필수)
        configureEach { publication ->
            if (publication instanceof MavenPublication) {
                publication.pom {
                    name = project.name
                    description = 'S2BuildSupport Plugin - A comprehensive utility library for Java'
                    url = 'https://github.com/devers2/s2-build-support'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'devers2'
                            name = '이승수'
                            email = 'eseungsu.dev@gmail.com'
                            organization = 'devers2'
                            organizationUrl = 'https://github.com/devers2'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/devers2/s2-build-support.git'
                        developerConnection = 'scm:git:ssh://github.com/devers2/s2-build-support.git'
                        url = 'https://github.com/devers2/s2-build-support'
                    }
                }
            }
        }

        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Central Portal 배포 설정
        maven {
            name = "CentralPortal"
            // Central Portal Zip Bundle Upload API (v1)
            // publishingType → AUTOMATIC : 자동 배포, USER_MANAGED : 사용자 관리 배포 (수동 승인/배포 필요 시)
            url = "https://central.sonatype.com/api/v1/publisher/upload?publishingType=USER_MANAGED"
            credentials {
                username = project.findProperty("centralUsername")
                password = project.findProperty("centralPassword")
            }
        }
    }
}

/**
 * [Central Portal Publication Hack]
 * The Central Portal API (v1) requires a Zip bundle for uploads and does not support
 * individual PUT requests (which results in 404 Not Found).
 * This block hijacks the default publishing task to create and upload a Zip bundle instead.
 */
afterEvaluate {
    tasks.withType(PublishToMavenRepository).configureEach { task ->
        if (task.repository?.name == 'CentralPortal') {
            // 1. Clear default actions to prevent individual file PUTs (404 error)
            task.actions.clear()

            // 2. Ensure signing tasks for this publication are executed before upload
            def publication = task.publication
            task.dependsOn tasks.withType(Sign)

            task.doLast {
                def centralUploadUrl = task.repository.url.toString()
                def isKo = java.util.Locale.default.language == 'ko'

                println(isKo ? "🚀 [중앙 포털] Zip 번들 업로드를 시작합니다 [${publication.name}]..." : "🚀 [Central Portal] Starting Zip bundle upload [${publication.name}]...")

                def buildDir = project.layout.buildDirectory.asFile.get()
                def bundleDir = new File(buildDir, "distributions/central-bundle/${publication.name}")
                if (bundleDir.exists()) project.delete(bundleDir)
                bundleDir.mkdirs()

                def version = publication.version
                def artifactId = publication.artifactId
                def group = publication.groupId

                def filesToBundle = []

                // 1) JARs & Signatures (Only for publications that have JARs)
                if (publication.name == 'mavenJava' || publication.name == 'pluginMaven') {
                    def libsDir = new File(buildDir, "libs")
                    if (libsDir.exists()) {
                        // Find main JAR, sources, javadoc and their signatures
                        def baseName = "${artifactId}-${version}"
                        libsDir.listFiles().each { f ->
                            if (f.name.startsWith(baseName) && (f.name.endsWith(".jar") || f.name.endsWith(".asc"))) {
                                filesToBundle << f
                            }
                        }
                    }
                }

                // 2) POM & Signature
                def pubDirName = publication.name
                def pomDir = new File(buildDir, "publications/${pubDirName}")
                if (pomDir.exists()) {
                    def pomFile = new File(pomDir, "pom-default.xml")
                    if (pomFile.exists()) {
                        def renamedPom = new File(bundleDir, "${artifactId}-${version}.pom")
                        java.nio.file.Files.copy(pomFile.toPath(), renamedPom.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        filesToBundle << renamedPom

                        // Also look for signed POM
                        def pomAsc = new File(pomDir, "pom-default.xml.asc")
                        if (pomAsc.exists()) {
                            def renamedPomAsc = new File(bundleDir, "${artifactId}-${version}.pom.asc")
                            java.nio.file.Files.copy(pomAsc.toPath(), renamedPomAsc.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                            filesToBundle << renamedPomAsc
                        }
                    }
                }

                if (filesToBundle.empty) {
                    println(isKo ? "⚠️ [중앙 포털] 번들링할 파일을 찾지 못했습니다 [${publication.name}]. 구성을 건너뜁니다." : "⚠️ [Central Portal] No files found to bundle [${publication.name}]. Skipping.")
                    return
                }

                // 3) Create Checksums & Verify Signatures
                def authenticatedFiles = []
                def fileNames = filesToBundle.collect { it.name } as Set

                filesToBundle.each { f ->
                    if (f.name.endsWith(".asc")) {
                        authenticatedFiles << f
                        return
                    }

                    if (!fileNames.contains(f.name + ".asc")) {
                        println(isKo ? "⚠️ [중앙 포털] 서명(.asc) 파일이 없어 건너뜁니다: ${f.name}. Maven Central은 서명이 필수입니다." : "⚠️ [Central Portal] Missing signature (.asc), skipping: ${f.name}. Signatures are required for Maven Central.")
                        return
                    }
                    authenticatedFiles << f

                    // Generate MD5 & SHA1 (Recommended/Required for Maven Central layout)
                    def content = f.readBytes()
                    ['MD5': 32, 'SHA-1': 40].each { algo, len ->
                        def digest = java.security.MessageDigest.getInstance(algo)
                        def hash = String.format("%0${len}x", new BigInteger(1, digest.digest(content)))
                        def hashFile = new File(bundleDir, "${f.name}.${algo.toLowerCase().replace('-', '')}")
                        hashFile.text = hash
                        authenticatedFiles << hashFile
                    }
                }

                if (authenticatedFiles.findAll { !it.name.endsWith(".asc") && !it.name.endsWith(".md5") && !it.name.endsWith(".sha1") }.empty) {
                    println(isKo ? "⚠️ [중앙 포털] 서명된 아티팩트가 없어 업로드를 중단합니다 [${publication.name}]." : "⚠️ [Central Portal] No signed artifacts found, aborting upload [${publication.name}].")
                    return
                }

                // 4) Create Zip Bundle
                def bundleFileName = "${artifactId}-${version}.zip"
                def zipFile = new File(buildDir, "distributions/${bundleFileName}")
                zipFile.parentFile.mkdirs()

                def groupPath = group.replace('.', '/')
                def mavenPathPrefix = "${groupPath}/${artifactId}/${version}/"

                new java.util.zip.ZipOutputStream(new FileOutputStream(zipFile)).withCloseable { zos ->
                    authenticatedFiles.unique { it.absolutePath }.each { file ->
                        def entryName = mavenPathPrefix + file.name
                        zos.putNextEntry(new java.util.zip.ZipEntry(entryName))
                        zos.write(file.readBytes())
                        zos.closeEntry()
                    }
                }
                println(isKo ? "📦 [중앙 포털] Zip 번들 생성 완료: ${zipFile.absolutePath}" : "📦 [Central Portal] Zip bundle created: ${zipFile.absolutePath}")

                // 5) Upload
                def user = project.findProperty("centralUsername")?.toString()?.trim()
                def pass = project.findProperty("centralPassword")?.toString()?.trim()

                if (!user || !pass) {
                    println(isKo ? "⚠️ [중앙 포털] 인증 정보가 없어 업로드를 건너뜁니다." : "⚠️ [Central Portal] Missing credentials, skipping upload.")
                    return
                }

                def boundary = "Boundary-" + System.currentTimeMillis()
                def client = java.net.http.HttpClient.newBuilder()
                        .connectTimeout(java.time.Duration.ofSeconds(60))
                        .build()

                // Construct multipart body
                def bytes = zipFile.readBytes()
                def header = "--${boundary}\r\n" +
                        "Content-Disposition: form-data; name=\"bundle\"; filename=\"${bundleFileName}\"\r\n" +
                        "Content-Type: application/zip\r\n\r\n"
                def footer = "\r\n--${boundary}--\r\n"

                def baos = new ByteArrayOutputStream()
                baos.write(header.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                baos.write(bytes)
                baos.write(footer.getBytes(java.nio.charset.StandardCharsets.UTF_8))

                def auth = Base64.encoder.encodeToString("${user}:${pass}".getBytes(java.nio.charset.StandardCharsets.UTF_8))
                def request = java.net.http.HttpRequest.newBuilder()
                        .uri(java.net.URI.create(centralUploadUrl))
                        .header("Content-Type", "multipart/form-data; boundary=${boundary}")
                        .header("Authorization", "Basic ${auth}")
                        .POST(java.net.http.HttpRequest.BodyPublishers.ofByteArray(baos.toByteArray()))
                        .build()

                def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofString())

                if (response.statusCode() >= 200 && response.statusCode() < 300) {
                    println(isKo ? "✅ [중앙 포털] 업로드 성공! [${publication.name}]" : "✅ [Central Portal] Upload successful! [${publication.name}]")
                } else {
                    println(isKo ? "❌ [중앙 포털] 업로드 실패 (HTTP ${response.statusCode()}): ${response.body()}" : "❌ [Central Portal] Upload failed (HTTP ${response.statusCode()}): ${response.body()}")
                }
            }
        }
    }
}
