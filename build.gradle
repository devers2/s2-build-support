/*
 * [Version Catalog]
 * 의존성 및 플러그인 버전은 'gradle/libs.versions.toml' 파일에서 통합 관리
 * 별도 설정 없이 Gradle이 기본 경로(gradle/libs.versions.toml)를 자동으로 인식하여 'libs' 접근자로 제공
 */
plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}
group = project.property('group')
version = project.property('version')
repositories {
    mavenCentral()
    gradlePluginPortal()
}
java {
    /**
     * [Java Toolchain]
     * 빌드 실행 환경(JAVA_HOME)과 프로젝트 컴파일 환경을 분리하는 현대적인 방식
     * 1. 일관성: 팀원 모두가 동일한 JDK 버전으로 빌드하도록 강제
     * 2. 자동화: 로컬에 해당 JDK가 없으면 설정된 리졸버(Foojay 등)를 통해 자동 다운로드
     * 3. 유연성: Gradle은 Java 17로 실행하면서, 프로젝트는 Java 21로 컴파일하는 등의 설정이 가능
     */
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
    }
}
dependencies {
    implementation gradleApi()
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.3.0'
}

/*
 * [Gradle 플러그인 배포]
 *
 * java-gradle-plugin이 자동으로 2개의 패키지를 생성합니다:
 *
 * 1. Plugin Marker (메타데이터)
 *    - 좌표: io.github.devers2.buildsupport:io.github.devers2.buildsupport.gradle.plugin:version
 *    - GitHub Packages 표시: io.github.devers2.buildsupport.io.github.devers2.buildsupport.gradle.plugin
 *    - 역할: 사용자가 'id: io.github.devers2.buildsupport'로 플러그인을 적용할 때 실제 JAR를 찾을 수 있도록 하는 메타데이터
 *
 * 2. Main JAR (실제 플러그인 코드)
 *    - 좌표: io.github.devers2:s2-build-support:version
 *    - GitHub Packages 표시: io.github.devers2.s2-build-support
 *    - 역할: S2BuildSupportPlugin 클래스 등 실제 플러그인 구현 코드 포함
 *
 * 이 두 패키지는 Gradle 플러그인 시스템의 표준 동작이며, 둘 다 필수입니다.
 *
 * [사용 방법]
 *
 * 1. settings.gradle에 저장소 추가:
 *    pluginManagement {
 *        repositories {
 *            gradlePluginPortal()
 *            maven {
 *                url = uri("https://maven.pkg.github.com/devers2/s2-packages")
 *                credentials {
 *                    username = 'your-github-username'
 *                    password = 'your-github-token'
 *                }
 *            }
 *        }
 *    }
 *
 * 2. build.gradle에 플러그인 적용:
 *    plugins {
 *        id 'io.github.devers2.buildsupport' version '2.0.0'
 *    }
 */
gradlePlugin {
    plugins {
        s2BuildSupportPlugin {
            id = 'io.github.devers2.buildsupport'
            implementationClass = 'io.github.devers2.buildsupport.S2BuildSupportPlugin'
            displayName = 'S2 Build Support'
            description = 'S2 project build utilities'
        }
    }
    // Plugin marker publication을 명시적으로 설정
    vcsUrl = 'https://github.com/devers2/s2-packages'
}
publishing {
    repositories {
        maven {
            name = 's2-packages'
            url = uri("https://maven.pkg.github.com/devers2/s2-packages")
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
